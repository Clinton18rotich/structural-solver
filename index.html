<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Solver: BS 8110 & BS 5950</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚡ Nuclear Structural Solver</h1>
        <p>BS 8110 (Concrete) & BS 5950 (Steel) | Step-by-Step Reports</p>
    </header>
    <div class="container">
        <div class="sidebar">
            <button class="tab-btn active" onclick="switchTab('concrete')">🧱 RC Beam (BS 8110)</button>
            <button class="tab-btn" onclick="switchTab('steel')">⚙️ Steel Beam (BS 5950)</button>
        </div>
        <div class="content">
            <div id="concrete-tab" class="tab-content active">
                <h2>Reinforced Concrete Beam (BS 8110)</h2>
                <div class="input-grid">
                    <label>Span (m): <input type="number" id="c_span" value="6" step="0.1"></label>
                    <label>Dead (kN/m): <input type="number" id="c_gk" value="25" step="0.1"></label>
                    <label>Imposed (kN/m): <input type="number" id="c_qk" value="19" step="0.1"></label>
                    <label>Width b (mm): <input type="number" id="c_b" value="300"></label>
                    <label>Depth h (mm): <input type="number" id="c_h" value="600"></label>
                    <label>f_cu (N/mm²): <input type="number" id="c_fcu" value="30"></label>
                    <label>f_y (N/mm²): <input type="number" id="c_fy" value="460"></label>
                    <label>Cover (mm): <input type="number" id="c_cov" value="25"></label>
                </div>
                <button class="action-btn" onclick="solveConcrete()">Calculate RC Beam</button>
                <div id="c_output" class="report-box"></div>
            </div>
            <div id="steel-tab" class="tab-content">
                <h2>Steel Beam (BS 5950)</h2>
                <div class="input-grid">
                    <label>Span (m): <input type="number" id="s_span" value="10" step="0.1"></label>
                    <label>Dead (kN/m): <input type="number" id="s_gk" value="5" step="0.1"></label>
                    <label>Imposed (kN/m): <input type="number" id="s_qk" value="15" step="0.1"></label>
                    <label>Steel Grade: <select id="s_grade"><option value="275">S275</option><option value="355" selected>S355</option><option value="460">S460</option></select></label>
                    <label>Restrained: <select id="s_rest"><option value="yes">Fully Restrained</option><option value="no">Unrestrained (LTB)</option></select></label>
                </div>
                <button class="action-btn" onclick="solveSteel()">Calculate Steel Beam</button>
                <div id="s_output" class="report-box"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="bs8110_concrete.js"></script>
    <script src="bs5950_steel.js"></script>
</body>
</html>
