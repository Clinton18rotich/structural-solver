<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Structural Suite: Analysis + BS 8110 & BS 5950</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Full Structural Suite</h1><p>Analysis • BS 8110 • BS 5950 | 100% of Notes</p></header>
    <div class="container">
        <div class="sidebar">
            <button class="tab-btn active" onclick="switchTab('analysis')">📊 Structural Analysis</button>
            <button class="tab-btn" onclick="switchTab('rcbeam')">🧱 RC Beam</button>
            <button class="tab-btn" onclick="switchTab('rccontbeam')">📏 RC Continuous Beam</button>
            <button class="tab-btn" onclick="switchTab('rcslab')">📐 RC Slab</button>
            <button class="tab-btn" onclick="switchTab('rctwoway')">📐 RC Two-Way Slab</button>
            <button class="tab-btn" onclick="switchTab('rccolumn')">🏢 RC Column</button>
            <button class="tab-btn" onclick="switchTab('rcfooting')">⬇️ RC Footing</button>
            <button class="tab-btn" onclick="switchTab('rcwall')">🧱 RC Retaining Wall</button>
            <button class="tab-btn" onclick="switchTab('steelbeam')">⚙️ Steel Beam</button>
            <button class="tab-btn" onclick="switchTab('steelcol')">🗼 Steel Column</button>
            <button class="tab-btn" onclick="switchTab('steelbaseplate')">🟦 Steel Baseplate</button>
            <button class="tab-btn" onclick="switchTab('steelconn')">🔩 Steel Connection</button>
            <button class="tab-btn" onclick="switchTab('composite')">🏗️ Composite Beam</button>
        </div>
        <div class="content">
            <div id="analysis-tab" class="tab-content active"></div>
            <div id="rcbeam-tab" class="tab-content"></div>
            <div id="rccontbeam-tab" class="tab-content"></div>
            <div id="rcslab-tab" class="tab-content"></div>
            <div id="rctwoway-tab" class="tab-content"></div>
            <div id="rccolumn-tab" class="tab-content"></div>
            <div id="rcfooting-tab" class="tab-content"></div>
            <div id="rcwall-tab" class="tab-content"></div>
            <div id="steelbeam-tab" class="tab-content"></div>
            <div id="steelcol-tab" class="tab-content"></div>
            <div id="steelbaseplate-tab" class="tab-content"></div>
            <div id="steelconn-tab" class="tab-content"></div>
            <div id="composite-tab" class="tab-content"></div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="analysis_engine.js"></script>
    <script src="tables.js"></script>
    <script src="concrete_engine.js"></script>
    <script src="steel_engine.js"></script>
</body>
</html>
